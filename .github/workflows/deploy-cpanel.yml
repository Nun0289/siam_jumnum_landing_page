name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-saimjumnum-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release.zip
        run: |
          set -euo pipefail
          mkdir -p .release
          rsync -a ./ .release/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.release/' \
            --exclude='router.php' \
            --exclude='release.zip' \
            --exclude='deploy-run.php' \
            --exclude='config/config.local.php' \
            --exclude='uploads/*' \
            --exclude='database/*.db'
          cp deployment/cpanel/.htaccess .release/.htaccess
          (cd .release && zip -qr ../release.zip .)
          ls -lh release.zip

      - name: Prepare extract script
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "Missing DEPLOY_TOKEN secret"
            exit 1
          fi
          php <<'PHP'
          <?php
          $token = getenv('DEPLOY_TOKEN');
          $src = file_get_contents('deployment/cpanel/deploy-run.php');
          $src = str_replace('__DEPLOY_TOKEN_PLACEHOLDER__', $token, $src, $count);
          if ($count !== 1) { fwrite(STDERR, "Token replace failed\n"); exit(1); }
          file_put_contents('deploy-run.php', $src);
          PHP

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:passive-mode true;
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 5;
            set xfer:clobber on;
            open -u '${FTP_USER}','${FTP_PASSWORD}' ${FTP_HOST};
            mkdir -f -p public_html/saimjumnum.charoencodegroup.com;
            put -O public_html/saimjumnum.charoencodegroup.com release.zip;
            put -O public_html/saimjumnum.charoencodegroup.com deploy-run.php;
            bye
          "

      - name: Extract release on server
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          url="https://saimjumnum.charoencodegroup.com/deploy-run.php"
          for i in 1 2 3 4 5; do
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w "%{http_code}" --max-time 300 \
              -X POST -H "X-Deploy-Token: ${DEPLOY_TOKEN}" "$url" || true)"
            echo "HTTP ${code}"
            cat "$body" || true
            echo
            if [ "$code" = "200" ] && grep -q "OK extract complete" "$body"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
